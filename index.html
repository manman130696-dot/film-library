<script>/* Desktop film library: original local sources, bundled previews, and research. */
(async () => {
  'use strict';
  try {
    await window.FILM_LIBRARY_READY;
  } catch (error) {
    console.error(error);
    const state = document.querySelector('#loading-state');
    state.textContent = '影片资料暂时未能加载，请检查网络后重试。';
    const retry = document.createElement('a');
    retry.href = location.href;
    retry.textContent = '重新加载';
    retry.className = 'button button-outline';
    const archive = document.createElement('a');
    archive.href = 'film-library-public/index.html';
    archive.textContent = '打开原版片库';
    archive.className = 'button button-outline';
    state.append(document.createElement('br'), retry, archive);
    return;
  }
  const data = window.FILM_LIBRARY;
  const videos = data.videos;
  const byId = Object.fromEntries(videos.map(v => [v.id,v]));
  const hosted = /^https?:/.test(location.protocol || location.href);
  const local = hosted ? {} : (window.FILM_LOCAL || {});
  const prompts = window.FILM_PROMPTS || {};
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const asset = p => window.FILM_ASSETS?.[p] || new URL(p,location.href).href;
  const clock = n => { n = Math.max(0,Math.floor(Number(n)||0));return (n>=3600?Math.floor(n/3600)+':':'')+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); };
  const icon = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
  let view='videos',direction='all',tag='all',selected=null,tab='overview',promptIndex=0,analysisMode='overview';
  let saved;
  try {saved=new Set(JSON.parse(localStorage.getItem('film-library-marks')||'[]'));}catch{saved=new Set();}
  const detail=$('#detail-dialog'), player=$('#detail-video');
  let toastTimer;
  function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2500);}
  function isSaved(id){return saved.has(id);}
  function toggleSave(id){if(saved.has(id))saved.delete(id);else saved.add(id);try{localStorage.setItem('film-library-marks',JSON.stringify([...saved]));}catch{}render();if(selected)updateDetailSave();}
  function searchable(v){return [v.title,v.subtitle,v.summary,v.preference,...v.tags,...v.categories,...(v.subjects||[])].join(' ').toLowerCase();}
  const tagPatterns={片头:/片头|开头|开场|钩子|片名|前奏/,B镜:/B\s*镜|辅助画面|解释|道具|资料|组合/i,包装:/包装|花字|版式|留白|标签|贴纸|抠像|边框|图卡/,叙事:/叙事|文案|递进|结构|观点|案例/,动画:/动画|动效|拼贴|MG|纸艺|拟人/i,声音:/音乐|音效|声音|配音|节奏/};
  function matches(v,extra=''){
    const q=$('#search').value.trim().toLowerCase(), text=searchable(v)+' '+extra.toLowerCase();
    return (!q||text.includes(q))&&($('#status-filter').value==='all'||v.status===$('#status-filter').value)&&(direction==='all'||v.categories.includes(direction))&&(tag==='all'||tagPatterns[tag].test(text));
  }
  function videoCard(v){return `<article class="video-card"><button class="card-open" data-open="${esc(v.id)}"><div class="card-poster"><img loading="lazy" src="${esc(asset(v.poster))}" alt="${esc(v.title)}${v.preview ? '原片画面' : '资料封面'}"><span class="card-status ${esc(v.status)}">${esc(v.statusLabel)}</span><span class="duration">${v.duration == null ? '待测量' : clock(v.duration)}</span><span class="card-hover-play">${icon('play')}</span></div><div class="card-body"><span class="card-category">${esc(v.categories.join(' / '))}</span><h3>${esc(v.title)}</h3><p class="card-summary">${esc(v.subtitle)}</p></div></button><div class="card-footer"><div class="card-tags">${v.tags.slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}</div><button class="bookmark-button ${isSaved(v.id)?'saved':''}" data-save="${esc(v.id)}" aria-label="${isSaved(v.id)?'取消标记':'标记'}${esc(v.title)}" aria-pressed="${isSaved(v.id)}">${icon('bookmark')}</button></div></article>`;}
  function caseCard(c){const v=byId[c.videoId];return `<article class="video-card case-card"><button class="card-open" data-open="${esc(v.id)}" data-case="${esc(c.id)}"><div class="card-poster"><img loading="lazy" src="${esc(asset(c.image||v.poster))}" alt="${esc(c.title)}"><span class="duration">${c.kind==='palette'?'配色参考 · '+c.palette.groups.length+' 组':clock(c.start)+'–'+clock(c.end)}</span><span class="card-hover-play">${c.kind==='palette'?'配色':icon('play')}</span></div><div class="card-body"><span class="card-category">${esc(c.tags.slice(0,3).join(' / '))}</span><h3>${esc(c.title)}</h3><p class="card-summary">${esc(c.why||c.structure)}</p>${c.kind==='palette'?paletteStrip(c):''}<p class="case-source">${esc(v.title)}</p></div></button></article>`;}
  function render(){
    const labels={videos:'全部作品',cases:'包装与 B 镜',saved:'我的标记'};
    $$('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    $$('[data-direction]').forEach(b=>{const active=b.dataset.direction===direction;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    $$('#tag-toolbar button').forEach(b=>b.classList.toggle('active',b.dataset.tag===tag));
    $('#hero').hidden=view!=='videos';$('#view-name').textContent=labels[view];$('#section-title').firstChild.textContent=direction==='all'?labels[view]:direction;
    $('#section-description').textContent=view==='cases'?'从真实片段里，找回具体的制作方法。':view==='saved'?'把想反复回看的作品放在这里。':(direction==='all'?'收藏的是方法，创作时再作选择。':data.categories.find(c=>c.name===direction)?.description||'');
    $('#total-count').textContent=videos.length;$('#saved-count').textContent=saved.size;
    let list=view==='cases'?data.cases.filter(c=>matches(byId[c.videoId],[c.title,...c.tags,c.structure,c.typography,c.motion,c.why].join(' '))):videos.filter(v=>matches(v)&&(view!=='saved'||isSaved(v.id)));
    const sort=$('#sort').value;
    if(sort==='short')list.sort((a,b)=>(view==='cases'?a.end-a.start:a.duration)-(view==='cases'?b.end-b.start:b.duration));
    if(sort==='long')list.sort((a,b)=>(view==='cases'?b.end-b.start:b.duration)-(view==='cases'?a.end-a.start:a.duration));
    if(sort==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
    if(sort==='recent'&&view==='cases')list.sort((a,b)=>videos.findIndex(v=>v.id===a.videoId)-videos.findIndex(v=>v.id===b.videoId)||a.start-b.start);
    $('#result-count').textContent=list.length;$('#video-grid').innerHTML=list.map(view==='cases'?caseCard:videoCard).join('');
    $('#empty-state').hidden=!!list.length;$('#loading-state').hidden=true;
    const filtered=!!$('#search').value||direction!=='all'||tag!=='all'||$('#status-filter').value!=='all';
    $('#filter-summary').hidden=!filtered;$('#filter-summary-text').textContent=`找到 ${list.length} ${view==='cases'?'个案例':'部作品'}`;
  }
  function reset(){direction='all';tag='all';$('#search').value='';$('#status-filter').value='all';render();}
  function jump(time){
    const currentId=selected?.id, currentSource=player.src;
    const t=Number(time)||0;if(!selected.preview&&player.dataset.full!=='true'){$('#playback-notice').hidden=false;$('#playback-notice').textContent='视频待确认公开；选择本地完整原片后即可按时间回看。';return;}const max=player.dataset.full==='true'?selected.duration:selected.previewDuration;
    if(t>=max){$('#playback-notice').hidden=false;$('#playback-notice').textContent=`当前播放的是前10秒预览，原片对应位置是 ${clock(t)}。可选择完整原片后跳转；右侧资料可直接查看。`;return;}
    const seek=()=>{if(!selected||selected.id!==currentId||player.src!==currentSource)return;if(Number.isFinite(player.duration)&&t>=player.duration){$('#playback-notice').hidden=false;$('#playback-notice').textContent='这个位置超出当前预览，选择完整原片后即可跳转。';return;}player.currentTime=t;player.play().catch(()=>{});};
    if(player.readyState)seek();else player.addEventListener('loadedmetadata',seek,{once:true});
  }
  function times(ts){return `<div class="time-buttons">${(ts||[]).slice(0,8).map(t=>`<button class="time-button" data-jump="${Number(t)}">${icon('play')}${clock(t)}</button>`).join('')}</div>`;}
  function updateDetailSave(){const b=$('#detail-save');b.classList.toggle('saved',isSaved(selected.id));b.setAttribute('aria-label',isSaved(selected.id)?'取消标记':'标记这部作品');b.setAttribute('aria-pressed',String(isSaved(selected.id)));}
  function casePlan(c){if(c.kind==='palette')return `${selected.title}｜${c.title}\n\n${c.apply}`;return `${selected.title}｜${c.title}
原片位置：${clock(c.start)}–${clock(c.end)}

原片观察
构图与层次：${c.structure||'见原片画面'}
字体与层级：${c.typography||'以原画面为准'}
动作过程：${c.motion||'以原片播放为准'}
作用：${c.why||''}

新作制作草案（设计建议）
${c.apply||'根据新片的叙事重点调整元素、版式与节奏。'}
建议分别准备底图、主体、文字和装饰图层；依次设计入场、信息成立、重点强调、离场。具体时长跟随新片语音与音乐，不套用未经核实的原片参数。`;}
  function paletteStrip(c){return `<div class="palette-strip" aria-label="近似参考色">${c.palette.groups[0].colors.map(color=>`<span class="palette-chip" style="background:${esc(color.hex)}" title="${esc(color.role+' '+color.hex)}"></span>`).join('')}</div>`;}
  function paletteContents(c){return `<article class="detail-case palette-reference" id="case-${esc(c.id)}"><span class="topic-tag">配色参考 · 包装与 B 镜</span><h3>${esc(c.title)}</h3><p>${esc(c.why)}</p><p class="palette-note">${esc(c.palette.note)}</p>${c.palette.groups.map(group=>`<section class="palette-group"><h4>${esc(group.name)}</h4><figure><img loading="lazy" src="${esc(asset(group.image))}" alt="${esc(group.sourceTitle)}配色对标画面"><figcaption>对标：${esc(group.sourceTitle)} · ${clock(group.start)}–${clock(group.end)}。${group.start>=selected.previewDuration?'该位置超出站内预览，可查看此归档截图；选择完整原片后可跳转。':'可用下方时间按钮回看。'}</figcaption></figure><p><strong>原画面观察</strong><br>${esc(group.observation)}</p><div class="palette-colors">${group.colors.map(color=>`<div class="palette-color"><span class="palette-color-sample" style="background:${esc(color.hex)}"></span><div class="palette-color-text"><b>${esc(color.role)}</b><code>${esc(color.hex)}</code>${esc(color.use)}</div></div>`).join('')}</div><p><strong>新作建议比例</strong><br>${esc(group.proportions)}</p><p><strong>B 镜怎么用</strong><br>${esc(group.broll)}</p>${times([group.start])}<section class="motion-plan"><span class="topic-tag">新作制作提示词 · 设计建议</span><p>${esc(group.prompt)}</p><p class="palette-note">制作时配合本组色值与建议比例；文字优先保证对比度，人物、动物和产品照片保留自然色。</p></section></section>`).join('')}<button class="button button-outline" data-copy-case="${esc(c.id)}">复制配色与 B 镜提示词</button></article>`;}
  function caseContents(c){if(c.kind==='palette')return paletteContents(c);return `<article class="detail-case" id="case-${esc(c.id)}"><img loading="lazy" src="${esc(asset(c.image||selected.poster))}" alt="${esc(c.title)}"><span class="topic-tag">${esc(c.tags.join(' · '))}</span><h3>${esc(c.title)}</h3><span class="evidence-badge">原片拆解 · ${clock(c.start)}–${clock(c.end)}</span>${[['构图与关系',c.structure],['字体与层级',c.typography],['动作过程',c.motion],['为什么这样设计',c.why]].filter(x=>x[1]).map(([label,value])=>`<p><strong>${esc(label)}</strong><br>${esc(value)}</p>`).join('')}${times([c.start])}<section class="motion-plan"><span class="topic-tag">新作制作草案 · 设计建议</span><h4>把这个方法做进新片</h4><p>${esc(c.apply||'根据新片的信息重点，重新确定元素、版式与节奏。')}</p><div class="motion-phases"><span><b>01 入场</b>建立主体</span><span><b>02 成立</b>读清信息</span><span><b>03 强调</b>突出重点</span><span><b>04 离场</b>接下个镜头</span></div><p class="motion-caveat">可拆为底图、主体、文字和装饰图层。动作时长按新片的语音与音乐调整；这里未记录原片的工程参数。</p><button class="button button-outline" data-copy-case="${esc(c.id)}">复制这份设计拆解</button></section></article>`;}
  function copyText(text){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text).then(()=>toast('已复制，可粘贴使用')).catch(()=>fallbackCopy(text));
    fallbackCopy(text);
  }
  function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.style.position='absolute';a.style.left='-9999px';detail.append(a);a.select();const ok=document.execCommand('copy');a.remove();toast(ok?'已复制，可粘贴使用':'请选中下方文字复制');}
  function renderPanel(){
    const activeTab=tab==='shots'?'overview':tab;
    $('#detail-panel').setAttribute('aria-labelledby','tab-'+activeTab);
    $$('.detail-tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.detailTab===activeTab)));
    const panel=$('#detail-panel');
    const status=`<div class="status-note">${esc(selected.statusLabel)} · ${(selected.shots||[]).length} 个观察段落<br>声音分析状态：${esc(selected.audioStatus||'以原报告为准')}</div>`;
    if(tab==='overview'){
      panel.innerHTML=status+`<p class="intro-note">${esc(selected.summary)}</p>`+(selected.topics||[]).map(t=>`<article class="topic"><span class="topic-tag">${esc(t.tag)}</span><h3>${esc(t.title)}</h3>${[['画面观察',t.observed],['为什么有效',t.meaning],['用于新作品',t.apply]].filter(x=>x[1]).map(([l,x])=>`<p><strong>${l}</strong>${esc(x)}</p>`).join('')}${times(t.times)}</article>`).join('');
      if(!(selected.topics||[]).length)panel.innerHTML+=`<p class="intro-note">这条目前保存了素材或初读资料。可以先播放、查看已有包装案例；尚未完成的分析不会显示为已完成。</p>`;
    }else if(tab==='shots'){
      const shots=selected.shots||[];
      panel.innerHTML=`<p class="intro-note">${shots.length} 个已记录的观察段落；图形转场和分段研究不等同于精确实拍切镜。</p>`+shots.map(s=>`<article class="shot-item"><div class="shot-time"><button class="time-button" data-jump="${s.start}">${icon('play')}${clock(s.start)}–${clock(s.end)}</button><span>${esc(s.id)}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.frame||s.fight)}</p>${s.fight&&s.fight!==s.frame?`<p>${esc(s.fight)}</p>`:''}${s.cameraRead||s.remake?`<details><summary>摄影与制作建议</summary><p>${esc(s.cameraRead)}</p><p>${esc(s.remake)}</p></details>`:''}</article>`).join('');
      if(!shots.length)panel.innerHTML+=`<p class="intro-note">目前没有可展示的已分析逐镜记录。</p>`;
    }else if(tab==='cases'){
      const cases=data.cases.filter(c=>c.videoId===selected.id);panel.innerHTML=cases.map(caseContents).join('')||`<p class="intro-note">这条尚未单独整理包装案例，可先查看研究概览和已有笔记。</p>`;
    }else if(tab==='prompts'){
      const list=prompts[selected.id]||[];
      if(list.length){promptIndex=Math.min(promptIndex,list.length-1);const p=list[promptIndex];panel.innerHTML=`<h3>可复制的制作提示词</h3><p class="intro-note">${esc(p.caption||'依据已有拆解整理的制作方案，与原片事实分开记录。')}</p><select class="panel-search" id="prompt-variant" aria-label="选择提示词方案">${list.map((p,i)=>`<option value="${i}" ${i===promptIndex?'selected':''}>${esc(p.label)}</option>`).join('')}</select><textarea readonly id="prompt-content" class="prompt-content" aria-label="提示词正文">${esc(p.text)}</textarea><button class="button button-dark" id="copy-prompt">复制这份提示词</button>`;}
      else panel.innerHTML=`<h3>包装与研究笔记</h3><p class="intro-note">这条未找到独立提示词文件。先展示现有分析，不补成已经验证的提示词。</p>`;
    }else{
      panel.innerHTML=status+`<h3>资料与使用笔记</h3><p class="intro-note">${esc(selected.preference)}</p>`;
      panel.innerHTML+=(selected.notes||[]).filter(n=>!['已记录的偏好与边界','片库标注'].includes(n.title)).map(n=>`<details class="note-card"><summary>${esc(n.title)}</summary><div class="note-body">${esc(n.text)}</div></details>`).join('');
    }
    if(tab==='overview'||tab==='shots') panel.insertAdjacentHTML('afterbegin',`<div class="analysis-switch" aria-label="拉片分析视图"><button data-analysis="overview" class="${tab==='overview'?'active':''}">研究概览</button><button data-analysis="shots" class="${tab==='shots'?'active':''}">逐镜观察 · ${(selected.shots||[]).length}</button></div>`);
    panel.scrollTop=0;
  }
  function openVideo(id,caseId){
    const v=byId[id];if(!v)return;selected=v;promptIndex=0;tab=caseId?'cases':'overview';analysisMode='overview';player.dataset.fallback='false';
    $('#detail-title').textContent=v.title;$('#detail-subtitle').textContent=v.summary;$('#detail-categories').textContent=v.categories.join(' / ');$('#detail-eyebrow').textContent='我的片库 · 作品档案';
    $('#detail-tags').innerHTML=v.tags.map(t=>`<span>${esc(t)}</span>`).join('');$('#detail-preference').innerHTML=`<strong>我的偏好与使用边界</strong>${esc(v.preference)}`;
    $('#playback-notice').hidden=true;player.poster=asset(v.poster);if(local[id]?.playback||v.preview)player.src=local[id]?.playback||asset(v.preview);else{player.removeAttribute('src');player.load();$('#playback-notice').hidden=false;$('#playback-notice').textContent='逐镜观察、B 镜位置和提示词已整理。视频与截图待确认公开；可选择完整原片在本机回看。配乐与音效仍待实际试听。';}player.dataset.full=String(!!local[id]?.playback||v.fullPreview);
    $('#playback-label').textContent=!v.preview&&!local[id]?.playback?'视频待确认公开':local[id]?.playback?'本地完整视频':v.fullPreview?'完整轻量预览':'原片前10秒预览';
    $('#open-original-report').disabled=!(local[id]?.report||v.report);
    updateDetailSave();renderPanel();if(!detail.open)detail.showModal();
    if(caseId){const c=data.cases.find(c=>c.id===caseId);if(c&&c.kind!=='palette')jump(c.start);requestAnimationFrame(()=>document.getElementById('case-'+caseId)?.scrollIntoView({block:'start'}));}
  }
  player.addEventListener('error',()=>{if(!selected||!detail.open||!player.hasAttribute('src')||!selected.preview)return;if(player.dataset.fallback!=='true'){player.dataset.fallback='true';player.src=asset(selected.preview);player.dataset.full=String(selected.fullPreview);$('#playback-label').textContent=selected.fullPreview?'完整轻量预览':'原片前10秒预览';$('#playback-notice').hidden=false;$('#playback-notice').textContent='当前浏览器未能打开本地原片，已切换到随附的兼容预览。可用“选择完整原片”重新指定视频。';}});
  detail.addEventListener('close',()=>{player.pause();player.removeAttribute('src');player.load();player.dataset.fallback='false';selected=null;});
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.open)openVideo(b.dataset.open,b.dataset.case);
    else if(b.dataset.save){toggleSave(b.dataset.save);}
    else if(b.dataset.view){view=b.dataset.view;reset();}
    else if(b.dataset.direction){direction=b.dataset.direction;render();}
    else if(b.dataset.tag){tag=b.dataset.tag;render();}
    else if(b.dataset.detailTab){tab=b.dataset.detailTab==='overview'?analysisMode:b.dataset.detailTab;renderPanel();}
    else if(b.dataset.analysis){analysisMode=b.dataset.analysis;tab=analysisMode;renderPanel();}
    else if(b.dataset.copyCase){const c=data.cases.find(x=>x.id===b.dataset.copyCase);copyText(casePlan(c));}
    else if(b.dataset.jump)jump(b.dataset.jump);
  });
  $('.brand').addEventListener('click',e=>{e.preventDefault();view='videos';reset();});
  $('#featured').addEventListener('click',()=>openVideo('autumn'));
  $('#detail-close').addEventListener('click',()=>detail.close());
  $('#detail-save').addEventListener('click',()=>toggleSave(selected.id));
  $('#search').addEventListener('input',render);$('#status-filter').addEventListener('change',render);$('#sort').addEventListener('change',render);
  $('#clear-filters').addEventListener('click',reset);$('#empty-clear').addEventListener('click',()=>{view='videos';reset();});
  $('#detail-panel').addEventListener('change',e=>{if(e.target.id==='prompt-variant'){promptIndex=Number(e.target.value);renderPanel();}});
  $('#detail-panel').addEventListener('click',e=>{if(e.target.closest('#copy-prompt'))copyText((prompts[selected.id]||[])[promptIndex]?.text||'');});
  $('#copy-detail').addEventListener('click',()=>copyText([selected.title,selected.summary,selected.preference,...(selected.topics||[]).map(t=>t.title+'\n'+t.observed+'\n'+t.meaning+'\n'+t.apply)].join('\n\n')));
  $('#choose-video').addEventListener('click',()=>$('#video-input').click());
  $('#video-input').addEventListener('change',e=>{const f=e.target.files[0];if(f){player.src=URL.createObjectURL(f);player.dataset.full='true';player.dataset.fallback='false';$('#playback-label').textContent='选择的完整原片';$('#playback-notice').hidden=true;}});
  $('#open-original-report').addEventListener('click',()=>{const report=local[selected.id]?.report||selected.report;if(report)window.open(report,'_blank','noopener');});
  $('#export-catalog').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({videos:videos.map(v=>({title:v.title,status:v.statusLabel,categories:v.categories,tags:v.tags,preference:v.preference})),saved:[...saved]},null,2)],{type:'application/json'}));a.download='片库清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)&&!detail.open){e.preventDefault();$('#search').focus();}});
  $('#hero-stats').innerHTML=`<div><strong>${videos.length}</strong><span>部作品</span></div><div><strong>${data.cases.length}</strong><span>个包装案例</span></div><div><strong>${videos.filter(v=>v.status!=='draft').length}</strong><span>部有研究笔记</span></div>`;
  $('#featured-image').src=asset(byId.autumn.poster);render();
})();
</script></body></html>
