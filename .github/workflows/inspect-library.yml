name: Inspect film library structure
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-library.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HTML without embedded media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text()
          text = re.sub(r'[A-Za-z0-9+/=]{1000,}', '[embedded-media]', text)
          print(text)
          PY
