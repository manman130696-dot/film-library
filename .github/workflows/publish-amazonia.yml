name: Publish approved Amazonia film reference
on:
  push:
    branches: [main]
    paths: ['reports/amazonia/upload-parts/**', '.github/scripts/check_palettes.cjs', 'entries/amazonia.json', '.github/workflows/publish-amazonia.yml']
permissions:
  contents: write
concurrency:
  group: film-library-amazonia-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore authorized files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, tarfile, json
          root = Path('reports/amazonia/upload-parts')
          m = json.loads((root/'manifest.json').read_text())
          assert m['sha256'] == '9e4503ae3cd90da24531e086fa62abf431ebc18926d0eb0c05c3644bd3bee4ac'
          assert m['bytes'] == 7272771
          assert m['files'] == json.loads('[".github/scripts/check_amazonia.cjs",".github/scripts/check_categories.cjs",".github/scripts/check_palettes.cjs","README.md","archive-loader.js","entries/amazonia.json","reports/amazonia/analysis.json","reports/amazonia/analysis.md","reports/amazonia/broll-and-palette.md","reports/amazonia/broll.json","reports/amazonia/frames/S01a.jpg","reports/amazonia/frames/S01b.jpg","reports/amazonia/frames/S02a.jpg","reports/amazonia/frames/S02b.jpg","reports/amazonia/frames/S03a.jpg","reports/amazonia/frames/S03b.jpg","reports/amazonia/frames/S04a.jpg","reports/amazonia/frames/S04b.jpg","reports/amazonia/frames/S05a.jpg","reports/amazonia/frames/S05b.jpg","reports/amazonia/frames/S06a.jpg","reports/amazonia/frames/S06b.jpg","reports/amazonia/frames/S07a.jpg","reports/amazonia/frames/S07b.jpg","reports/amazonia/frames/S08a.jpg","reports/amazonia/frames/S08b.jpg","reports/amazonia/frames/S09a.jpg","reports/amazonia/frames/S09b.jpg","reports/amazonia/frames/S10a.jpg","reports/amazonia/frames/S10b.jpg","reports/amazonia/frames/S11a.jpg","reports/amazonia/frames/S11b.jpg","reports/amazonia/frames/S12a.jpg","reports/amazonia/frames/S12b.jpg","reports/amazonia/frames/S13a.jpg","reports/amazonia/frames/S13b.jpg","reports/amazonia/frames/S14a.jpg","reports/amazonia/frames/S14b.jpg","reports/amazonia/frames/S15a.jpg","reports/amazonia/frames/S15b.jpg","reports/amazonia/frames/S16a.jpg","reports/amazonia/frames/S16b.jpg","reports/amazonia/frames/S17a.jpg","reports/amazonia/frames/S17b.jpg","reports/amazonia/frames/S18a.jpg","reports/amazonia/frames/S18b.jpg","reports/amazonia/frames/S19a.jpg","reports/amazonia/frames/S19b.jpg","reports/amazonia/frames/S20a.jpg","reports/amazonia/frames/S20b.jpg","reports/amazonia/frames/S21a.jpg","reports/amazonia/frames/S21b.jpg","reports/amazonia/frames/S22a.jpg","reports/amazonia/frames/S22b.jpg","reports/amazonia/frames/S23a.jpg","reports/amazonia/frames/S23b.jpg","reports/amazonia/frames/S24a.jpg","reports/amazonia/frames/S24b.jpg","reports/amazonia/frames/S25a.jpg","reports/amazonia/frames/S25b.jpg","reports/amazonia/frames/S26a.jpg","reports/amazonia/frames/S26b.jpg","reports/amazonia/frames/S27a.jpg","reports/amazonia/frames/S27b.jpg","reports/amazonia/frames/S28a.jpg","reports/amazonia/frames/S28b.jpg","reports/amazonia/frames/S29a.jpg","reports/amazonia/frames/S29b.jpg","reports/amazonia/frames/S30a.jpg","reports/amazonia/frames/S30b.jpg","reports/amazonia/frames/S31a.jpg","reports/amazonia/frames/S31b.jpg","reports/amazonia/frames/S32a.jpg","reports/amazonia/frames/S32b.jpg","reports/amazonia/frames/S33a.jpg","reports/amazonia/frames/S33b.jpg","reports/amazonia/frames/S34a.jpg","reports/amazonia/frames/S34b.jpg","reports/amazonia/frames/S35a.jpg","reports/amazonia/frames/S35b.jpg","reports/amazonia/frames/S36a.jpg","reports/amazonia/frames/S36b.jpg","reports/amazonia/frames/S37a.jpg","reports/amazonia/frames/S37b.jpg","reports/amazonia/frames/S38a.jpg","reports/amazonia/frames/S38b.jpg","reports/amazonia/frontend-qa.json","reports/amazonia/palette.json","reports/amazonia/portraits/G.jpg","reports/amazonia/portraits/H.jpg","reports/amazonia/preview-web.mp4","reports/amazonia/reverse-prompts.json","reports/amazonia/reverse-prompts.md","reports/amazonia/shots-report.html","reports/amazonia/shots.json","reports/amazonia/shots.md","reports/amazonia/source.json","reports/amazonia/timed-camera-prompts.json","reports/amazonia/timed-camera-prompts.md","reports/amazonia/track.json","reports/amazonia/validation.json","reports/amazonia/validation.txt"]')
          assert len(m['parts']) == 14
          assert all(Path(n).name == n and n.startswith('bundle-') and n.endswith('.part') for n in m['parts'])
          data = b''.join((root/n).read_bytes() for n in m['parts'])
          assert len(data) == m['bytes'] and hashlib.sha256(data).hexdigest() == m['sha256']
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
              members = tf.getmembers()
              assert len(members) == len(m['files']) and {x.name for x in members} == set(m['files'])
              assert all(x.isfile() and not Path(x.name).is_absolute() and '..' not in Path(x.name).parts for x in members)
              tf.extractall('.',members=[x for x in members if x.name not in ['.github/scripts/check_palettes.cjs', 'entries/amazonia.json']],filter='data')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Prepare browser
        run: npx playwright install --with-deps chromium
      - name: Verify existing and new film behavior
        run: |
          node --test tests/packaging-core.test.mjs
          node .github/scripts/check_categories.cjs
      - name: Publish verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-loader.js entries/amazonia.json README.md reports/amazonia .github/scripts/check_categories.cjs .github/scripts/check_palettes.cjs .github/scripts/check_amazonia.cjs
          git rm reports/amazonia/upload-parts/bundle-*.part reports/amazonia/upload-parts/manifest.json
          git commit -m 'Add Amazonia aesthetic film with B-roll, packaging and palette references'
          git push origin HEAD:main
