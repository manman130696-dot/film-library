name: Check film categories
on:
  push:
    branches: [main, codex/film-categories, codex/film-palettes, codex/visual-reference]
    paths:
      - index.html
      - archive-loader.js
      - visual-reference.mjs
      - visual-reference.css
      - entries/amazonia.json
      - .github/scripts/check_visual_reference.cjs
      - categories.json
      - entries/palette-references.json
      - .github/scripts/check_palettes.cjs
      - .github/scripts/check_categories.cjs
      - .github/scripts/check_cityride.cjs
      - entries/cityride.json
      - reports/cityride/online-report.html
      - .github/workflows/check-categories.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser check dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Prepare test browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile behavior
        run: node .github/scripts/check_categories.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reference-screenshots
          path: /tmp/visual-reference-*.png
          if-no-files-found: ignore
