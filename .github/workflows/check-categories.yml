name: Check film categories
on:
  push:
    branches: [main, codex/film-categories]
    paths:
      - index.html
      - archive-loader.js
      - categories.json
      - .github/scripts/check_categories.cjs
      - .github/scripts/check_cityride.cjs
      - .github/scripts/check_cognition.cjs
      - .github/scripts/serve_preview.py
      - entries/cityride.json
      - entries/cognition-gap.json
      - reports/cityride/online-report.html
      - reports/cognition-gap/**
      - .github/workflows/check-categories.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser check dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Prepare test browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile behavior
        run: node .github/scripts/check_categories.cjs
